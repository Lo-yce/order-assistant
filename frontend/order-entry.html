<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>校园图书下单</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="css/style.css" />
  <style>
    /* 顾客页为独立外观，无后台导航 */
    .entry-hero { background: linear-gradient(135deg, var(--pri), #12b8ae); color: #fff; text-align:center; padding: 28px 16px; }
    .entry-hero .big { font-size: 22px; font-weight: 800; }
    .entry-hero .sm { font-size: 13px; opacity: .85; margin-top: 6px; }
    form { padding: 16px; }
    .ok-panel { text-align:center; padding: 40px 20px; }
    .ok-panel .bi { font-size: 56px; color: var(--pri); }
    .ok-panel .t { font-size: 20px; font-weight: 800; margin: 12px 0 6px; }
    .ok-panel .s { color: var(--muted); font-size: 14px; }
    .ok-panel .acts { margin-top: 18px; display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
    .my-order-item { border: 1px solid var(--pri-light); border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; text-align: left; font-size: 13px; }
    .my-order-item .tag { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 12px; }
    .tag-pending { background: #fdeaea; color: var(--danger); }
    .tag-delivering { background: #fdf3e2; color: var(--warn); }
    .tag-done { background: var(--pri-light); color: var(--pri-dark); }
    .my-order-item .m-tag { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 12px; background: #eef2f6; color: #5a6b7a; margin-right: 4px; }
  </style>
</head>
<body>
  <div class="entry-hero">
    <div class="big"><i class="bi bi-book"></i> 校园二手图书 · 下单</div>
    <div class="sm">填写下方信息即可下单，我们会按你的区域和时间配送</div>
  </div>

    <form id="orderForm" onsubmit="return false">
    <div class="card">
      <datalist id="bookNamesList"></datalist>

      <!-- 配送方式切换：配送 / 自提 -->
      <div class="field">
        <label>取书方式 <span class="req">*</span></label>
        <div class="method-toggle">
          <button type="button" class="mt-btn active" id="mDelivery" onclick="setMethod('delivery')"><i class="bi bi-bicycle"></i> 配送到宿舍</button>
          <button type="button" class="mt-btn" id="mPickup" onclick="setMethod('self_pickup')"><i class="bi bi-shop"></i> 到点自提</button>
        </div>
      </div>

      <div id="deliveryFields">
        <div class="field">
          <label>配送区域 <span class="req">*</span></label>
          <select class="input building" id="eBuilding">
            <option value="">选择你所在的大苑</option>
            <option value="大千苑18栋">大千苑18栋</option>
            <option value="长江苑19栋">长江苑19栋</option>
            <option value="大洲苑21栋">大洲苑21栋</option>
            <option value="培伦苑20栋">培伦苑20栋</option>
          </select>
        </div>
        <div class="field">
          <label>宿舍楼号 <span class="req">*</span></label>
          <select class="input zone" id="eZone"><option value="">先选择大苑</option></select>
        </div>
      </div>

      <div id="pickupFields" style="display:none">
        <div class="field">
          <label>自提地点</label>
          <input class="input" id="ePickup" value="师生活动中心" placeholder="默认师生活动中心，可修改" />
          <div style="font-size:12px;color:var(--muted);margin-top:5px">下单后按「待配送」状态提示的时间到自提点找我们取书。</div>
        </div>
      </div>

      <div class="field">
        <label>预定时间（不填则尽快）</label>
        <input class="input time" id="eTime" type="datetime-local" />
      </div>
      <div class="field">
        <label>联系方式（手机号 / QQ / 微信）<span class="req">*</span></label>
        <input class="input contact" id="eContact" placeholder="用于配送联系" />
      </div>
      <div class="field">
        <label>备注（选填）</label>
        <input class="input remark" id="eRemark" placeholder="如：放门口、到了打电话" />
      </div>
    </div>

    <div class="card">
      <h3 style="font-size:16px;margin-bottom:10px">需要购买的书籍 <span class="req">*</span></h3>
      <div id="itemBox"></div>
      <button type="button" class="btn ghost sm row-add" id="addRowBtn"><i class="bi bi-plus-lg"></i> 再添加一本</button>
    </div>

    <button type="button" class="btn primary block" id="eSubmit" style="margin:0 14px 12px;width:calc(100% - 28px)">提交订单</button>
    <button type="button" class="btn ghost sm" id="myOrdersBtn" style="margin:0 14px 20px">查我的订单</button>
  </form>

  <div class="card" id="myOrdersCard" style="display:none;margin:0 14px 20px">
    <h3 style="font-size:16px;margin-bottom:10px">查我的订单</h3>
    <div class="field">
      <input class="input" id="myContact" placeholder="输入下单时的联系方式（手机号 / QQ / 微信）" />
    </div>
    <button type="button" class="btn primary sm" onclick="queryMyOrders()">查询</button>
    <button type="button" class="btn ghost sm" onclick="toggleMyOrders(false)">收起</button>
    <div id="myOrdersResult" style="margin-top:12px"></div>
  </div>

  <div class="ok-panel" id="okPanel" style="display:none"></div>

  <div class="toast" id="toast"></div>

  <script>
    /* API 地址：EdgeOne Pages 部署时前后端同域走相对路径；GitHub Pages 部署时走 Cloudflare Worker */
    const WORKER_BASE = location.hostname.endsWith("edgeone.app") ? "" : "https://order-assistant-worker.loyce.workers.dev";
    const BUILDINGS = {
      "大千苑18栋": ["18-1","18-2","18-3","18-4"],
      "长江苑19栋": ["19-1","19-2","19-3","19-4"],
      "大洲苑21栋": ["21-1","21-2","21-3","21-4"],
      "培伦苑20栋": ["20-1","20-2","20-3","20-4"],
    };

    function $(sel){ return document.querySelector(sel); }
    function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

    let toastTimer;
    function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove("show"),2200); }

    function itemRow(book, qty){
      return `<div class="item-row">
        <input class="input item-book" list="bookNamesList" placeholder="书名" value="${esc(book||"")}" />
        <input class="input item-qty" type="number" min="1" step="1" placeholder="数量" value="${qty||1}" />
        <button type="button" class="trash" onclick="delRow(this)"><i class="bi bi-x-lg"></i></button>
      </div>`;
    }
    window.delRow = function(btn){
      const box=$("#itemBox");
      if(box.children.length<=1){ toast("至少保留一本书"); return; }
      btn.closest(".item-row").remove();
    };

    // 取书方式切换：配送 ⇄ 自提
    let orderMethod = "delivery";
    window.setMethod = function(m){
      orderMethod = m;
      $("#mDelivery").classList.toggle("active", m === "delivery");
      $("#mPickup").classList.toggle("active", m === "self_pickup");
      $("#deliveryFields").style.display = m === "delivery" ? "" : "none";
      $("#pickupFields").style.display = m === "self_pickup" ? "" : "none";
    };

    // 大苑 → 楼号联动
    $("#eBuilding").addEventListener("change", function(){
      const zones = BUILDINGS[this.value] || [];
      const sel = $("#eZone");
      sel.innerHTML = '<option value="">选择楼号</option>' + zones.map(z=>`<option value="${z}">${z}</option>`).join("");
      sel.disabled = !zones.length;
    });

    // 初始化一行 + 加载联想书名
    $("#itemBox").innerHTML = itemRow();
    $("#addRowBtn").onclick = ()=>{ $("#itemBox").insertAdjacentHTML("beforeend", itemRow()); };

    fetch(WORKER_BASE + "/api/book-names").then(r=>r.json()).then(d=>{
      if(d.ok) $("#bookNamesList").innerHTML = d.data.map(n=>`<option value="${esc(n)}"></option>`).join("");
    }).catch(()=>{});

    // —— 查我的订单 ——
    const STATUS_NAME = { pending:"待配送", delivering:"配送中", done:"已完成" };
    window.toggleMyOrders = function(show){
      $("#myOrdersCard").style.display = show ? "" : "none";
      if(show) setTimeout(()=>{ try{ $("#myContact").focus(); }catch(e){} }, 60);
    };
    $("#myOrdersBtn").onclick = ()=> toggleMyOrders(true);
    function renderMyOrders(list){
      if(!list.length){ $("#myOrdersResult").innerHTML = '<div class="empty">没有找到相关订单</div>'; return; }
      $("#myOrdersResult").innerHTML = list.map(o=>{
        const place = o.delivery_method === "self_pickup"
          ? `<span class="m-tag">自提</span>${esc(o.pickup_location || "师生活动中心")}`
          : `<span class="m-tag">配送</span>${esc(o.delivery_building)} ${esc(o.sub_zone)}`;
        return `
        <div class="my-order-item">
          <b>#${o.id}</b> · ${place}
          <span class="tag tag-${o.status}">${STATUS_NAME[o.status]||o.status}</span>
          <div style="color:var(--muted);margin-top:4px">${(o.items||[]).map(it=>`${esc(it.book_name)} ×${it.quantity}`).join("、")}</div>
        </div>`;
      }).join("");
    }
    window.queryMyOrders = async function(){
      const c = $("#myContact").value.trim();
      if(!c) return toast("请输入下单时的联系方式");
      const btnWrap = $("#myOrdersResult");
      btnWrap.innerHTML = '<div class="empty">查询中…</div>';
      try{
        const resp = await fetch(WORKER_BASE + "/api/my-orders?contact=" + encodeURIComponent(c));
        const rj = await resp.json().catch(()=>({}));
        if(!rj.ok) throw new Error(rj.error || "查询失败");
        renderMyOrders(rj.data || []);
      }catch(e){ btnWrap.innerHTML = '<div class="empty">查询失败，请稍后再试</div>'; }
    };

    $("#eSubmit").onclick = async function(){
      const method = orderMethod;
      const building = $("#eBuilding").value;
      const zone = $("#eZone").value;
      const pickup = $("#ePickup").value.trim() || "师生活动中心";
      const contact = $("#eContact").value.trim();
      const remark = $("#eRemark").value.trim();
      let time = $("#eTime").value;
      if(time){ const d = new Date(time); time = isNaN(d)? "": d.toISOString(); }

      const items = [];
      document.querySelectorAll(".item-row").forEach(r=>{
        const name = r.querySelector(".item-book").value.trim();
        const qty = parseInt(r.querySelector(".item-qty").value,10);
        if(name && qty>=1) items.push({book_name:name, quantity:qty});
      });

      if(method === "delivery" && (!building || !zone)) return toast("请选择你所在的配送区域和楼号");
      if(!contact) return toast("请填写联系方式");
      if(!items.length) return toast("请至少填写一本书");

      const btn=this; btn.disabled=true;
      try{
        // 简单防重复：按钮禁用期为 3 秒
        const resp = await fetch(WORKER_BASE+"/api/orders", {method:"POST", headers:{"Content-Type":"application/json"},
          body: JSON.stringify({delivery_method:method, delivery_building:building, sub_zone:zone, pickup_location:pickup, deliver_time:time, contact, remark, items})});
        const rj = await resp.json().catch(()=>({}));
        if(!rj.ok) throw new Error(rj.error || "提交失败");
        const orderId = rj.data && rj.data.id;
        document.getElementById("orderForm").style.display="none";
        toggleMyOrders(false);
        const ok=$("#okPanel");
        ok.style.display="block";
        const where = method === "self_pickup" ? `到 <b>${esc(pickup)}</b> 自提` : `配送到 <b>${esc(building)} ${esc(zone)}</b>`;
        ok.innerHTML = `<div class="bi bi-check-circle-fill"></div>
          <div class="t">下单成功！</div>
          <div class="s">订单编号 <b>#${orderId}</b>，我们会${where}，请保持联系畅通。</div>
          <div class="acts">
            <button type="button" class="btn ghost sm" onclick="orderAgain()">再下一单</button>
            <button type="button" class="btn primary sm" onclick="afterOrderQuery()">查我的订单</button>
          </div>`;
        window._lastContact = contact;
      }catch(e){ toast(e.message || "提交失败，请稍后再试"); btn.disabled=false; }
    };
    // 再下一单：保留区域/楼号/联系方式，清空书单
    window.orderAgain = function(){
      $("#okPanel").style.display="none";
      document.getElementById("orderForm").style.display="";
      $("#itemBox").innerHTML = itemRow();
      $("#eSubmit").disabled = false;
    };
    // 下单成功后查单：自动带入刚填的联系方式
    window.afterOrderQuery = function(){
      document.getElementById("orderForm").style.display="none";
      $("#okPanel").style.display="none";
      toggleMyOrders(true);
      if(window._lastContact) $("#myContact").value = window._lastContact;
      queryMyOrders();
    };
  </script>
</body>
</html>
