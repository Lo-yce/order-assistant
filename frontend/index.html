<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>订单助手 · 后台</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="app">
  <header class="topbar">
    <div style="display:flex;align-items:center;justify-content:space-between">
      <div class="title"><i class="bi bi-truck" style="margin-right:6px"></i>校园二手图书订单助手</div>
      <button class="btn ghost sm no-print" onclick="App.logout()" title="清除本机保存的后台密码"><i class="bi bi-box-arrow-right"></i> 退出</button>
    </div>
    <div class="sub" id="topSub">初始加载中…</div>
  </header>

  <main class="container">
    <!-- 区域配送（首页） -->
    <section class="page active" id="page-dashboard">
      <div id="dashboardInner"></div>
    </section>

    <!-- 订单列表 -->
    <section class="page" id="page-orders">
      <div class="toolbar no-print">
        <button class="btn ghost sm" onclick="App.shareLink()"><i class="bi bi-share"></i> 分享下单链接</button>
        <button class="btn ghost sm" onclick="App.exportManifest()"><i class="bi bi-printer"></i> 配送清单</button>
      </div>
      <div class="chips" id="orderChips"></div>
      <div id="orderList"></div>
    </section>

    <!-- 新建/编辑订单 -->
    <section class="page" id="page-form">
      <div id="formInner"></div>
    </section>

    <!-- 统计 -->
    <section class="page" id="page-stats">
      <div class="toolbar no-print">
        <input class="input" id="statSearch" placeholder="模糊搜索，如：高数 下" style="flex:1;min-width:120px" oninput="App.renderStats()" />
        <button class="btn ghost sm" onclick="App.loadStats()"><i class="bi bi-arrow-clockwise"></i></button>
      </div>
      <div class="chips" id="statBuildingChips"></div>
      <div class="toolbar no-print" style="margin-top:2px">
        <button class="btn ghost sm" onclick="App.exportStatsCsv()"><i class="bi bi-file-earmark-spreadsheet"></i> 导出 CSV</button>
        <button class="btn ghost sm" onclick="document.getElementById('invFile').click()"><i class="bi bi-upload"></i> 导入 Excel 库存</button>
        <input type="file" id="invFile" accept=".xlsx,.xls" style="display:none" onchange="App.importInventory(this)" />
      </div>
      <div id="statsInner"></div>
    </section>

    <!-- 历史订单 -->
    <section class="page" id="page-history">
      <button class="btn danger no-print" onclick="App.clearDone()"><i class="bi bi-trash3"></i> 清空已完成订单</button>
      <div id="historyInner" style="margin-top:12px"></div>
    </section>
  </main>

  <nav class="nav no-print">
    <a href="#/dashboard" data-tab="dashboard"><i class="bi bi-house-heart"></i>区域配送</a>
    <a href="#/orders" data-tab="orders"><i class="bi bi-list-check"></i>订单列表</a>
    <a href="#/new" data-tab="new"><i class="bi bi-plus-circle"></i>新建订单</a>
    <a href="#/stats" data-tab="stats"><i class="bi bi-bar-chart"></i>统计</a>
    <a href="#/history" data-tab="history"><i class="bi bi-clock-history"></i>历史</a>
  </nav>
  <style>
    /* 底部导航红点：有待配送订单时提示 */
    .nav a { position: relative; }
    .nav a .nav-dot {
      position: absolute;
      top: 2px; right: 50%; margin-right: -22px;
      width: 9px; height: 9px;
      border-radius: 50%;
      background: var(--danger);
      display: none;
    }
    .nav a.has-pending .nav-dot { display: block; }
  </style>

  <div class="toast" id="toast"></div>

  <div class="modal-mask" id="modalMask">
    <div class="modal">
      <h3 id="modalTitle"></h3>
      <p id="modalText"></p>
      <div class="btns">
        <button class="btn ghost" onclick="App.closeModal()">取消</button>
        <button class="btn danger" id="modalOk">确认</button>
      </div>
    </div>
  </div>

  <!-- 后台密码弹窗 -->
  <div class="modal-mask" id="pwdMask">
    <div class="modal">
      <h3>后台访问密码</h3>
      <p id="pwdText">请输入团队共享密码，输入一次后本机记住。</p>
      <input class="input" type="password" id="pwdInput" placeholder="密码" style="width:100%" />
      <div class="btns" style="margin-top:14px">
        <button class="btn ghost" onclick="App.closePwd()">取消</button>
        <button class="btn primary" onclick="App.submitPwd()">确定</button>
      </div>
    </div>
  </div>

  <!-- 库存快捷编辑弹窗 -->
  <div class="modal-mask" id="invEditMask">
    <div class="modal">
      <h3>修改库存</h3>
      <p id="invEditBook" style="font-weight:700;color:var(--text)"></p>
      <div style="display:flex;align-items:center;gap:10px;margin-top:4px">
        <button class="btn ghost sm" onclick="App.invEditStep(-1)" style="font-size:20px;flex:none">−</button>
        <input class="input" type="number" id="invEditInput" min="0" step="1" style="width:100%;text-align:center;font-size:18px" />
        <button class="btn ghost sm" onclick="App.invEditStep(1)" style="font-size:20px;flex:none">+</button>
      </div>
      <p style="margin-top:10px;margin-bottom:0">找到多的书直接加库存，剩余数量会自动重算。</p>
      <div class="btns" style="margin-top:14px">
        <button class="btn ghost" onclick="App.closeInvEdit()">取消</button>
        <button class="btn primary" onclick="App.saveInvEdit()">保存</button>
      </div>
    </div>
  </div>

  <!-- 配送清单打印容器（隐藏） -->
  <div id="printArea" style="display:none"></div>

  <script src="js/vendor/xlsx.full.min.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
