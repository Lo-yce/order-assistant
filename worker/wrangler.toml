name = "order-assistant-worker"
main = "src/index.js"
compatibility_date = "2024-01-01"

# 说明：在 Cloudflare 控制台或命令创建 D1 数据库后，把 database_id 替换成实际 ID。
# 新建并初始化：npx wrangler d1 create order-assistant-db
[[d1_databases]]
binding = "DB"
database_name = "order-assistant-db"
database_id = "your-d1-database-id-here"